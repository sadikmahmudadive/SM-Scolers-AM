[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sm-scolers-bridge"
version = "0.1.0"
description = "Headless bridge service: ZKTeco device punches to Firestore, with SMS alerts"
requires-python = ">=3.12"
dependencies = [
  "firebase-admin>=6",
  "google-cloud-firestore>=2.11",
  "pyserial>=3.5",
  "pyzk>=0.9",
  "tzdata>=2024.1",
]

[project.scripts]
sm-scolers-bridge = "bridge.service:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
