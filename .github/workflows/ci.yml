name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Public placeholders, not secrets: the build only needs the variables to exist.
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.example
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-project
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:1:web:ci"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck build
      # firebase-tests (Firestore emulator, needs Java) runs only in the rules job.
      - run: pnpm turbo run test --filter='!firebase-tests'

  rules:
    name: rules (Firestore emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter firebase-tests test

  bridge:
    name: bridge (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/bridge/pyproject.toml
      - run: pnpm install --frozen-lockfile
      - run: pip install -e "apps/bridge[dev]"
      - name: Bridge unit tests
        run: pytest apps/bridge/tests -q
      # Separate invocation: pytest takes its rootdir and pythonpath from firebase/pytest.ini.
      - name: Migration tests
        run: pytest firebase/tests/test_migrate.py -q
      - name: Emulator-backed store tests
        run: >-
          firebase/node_modules/.bin/firebase emulators:exec
          --config firebase/firebase.json --only firestore --project demo-hrm
          "python -m pytest apps/bridge/tests/test_firestore_store.py -q"

  e2e:
    name: e2e (Playwright on emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hrm/web exec playwright install --with-deps chromium
      - run: pnpm --filter @hrm/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
          if-no-files-found: ignore
