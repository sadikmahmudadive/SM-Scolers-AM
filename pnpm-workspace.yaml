packages:
  - "apps/*"
  - "packages/*"
  - "firebase"
allowBuilds:
  esbuild: true
  # Postinstall scripts are not needed for the rules tests (reviewed and denied).
  "@firebase/util": false
  protobufjs: false
  # Prebuilt napi binaries ship via optional deps; postinstall fallback not needed (reviewed and denied).
  unrs-resolver: false
